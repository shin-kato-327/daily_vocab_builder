[project]
name = "vocabulary-builder"
version = "0.1.0"
description = "Daily Telegram vocabulary and American phrase practice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vocabulary_builder"]
